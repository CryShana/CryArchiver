[workspace]
resolver = "3"
members = ["crates/cryarchiver-engine", "crates/cryarchiver-project", "crates/cryarchiver-tui", "crates/cryarchiver"]
exclude = ["vendor/avif-serialize"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
avif-serialize = "0.8.9"
base64 = "0.23.1"
blake3 = "1.8.7"
brotli-decompressor = "6.0.1"
caseless = "0.2.2"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
directories = "6.0.0"
fast-ssim2 = { version = "0.8.2", features = ["rayon"] }
flate2 = "1.1.10"
globset = "0.4.20"
image = { version = "0.25.10", default-features = false, features = ["rayon", "jpeg", "png", "gif", "webp", "bmp", "tiff", "tga", "pnm", "qoi"] }
indicatif = "0.18.6"
infer = "0.22.0"
insta = "1.48.0"
jxl-oxide = { version = "0.12.6", features = ["moxcms"] }
libc = "0.2"
lofty = "0.25.4"
moxcms = "0.8.1"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
quick-xml = "0.42.0"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
rayon = "1.12.0"
redb = "4.3.0"
rgb = "0.8.53"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
throbber-widgets-tui = "0.11.1"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "signal", "sync"] }
tokio-util = "0.7.19"
tui-input = "0.15.5"
ulid = "3.0.0"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading"] }

[patch.crates-io]
avif-serialize = { path = "vendor/avif-serialize" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3
