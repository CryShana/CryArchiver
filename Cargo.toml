[workspace]
resolver = "3"
members = ["crates/cryarchiver-engine", "crates/cryarchiver"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
globset = "0.4.20"
indicatif = "0.18.6"
infer = "0.22.0"
libc = "0.2"
lofty = "0.25.4"
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "creation-flags", "job-object", "kill-on-drop", "process-group"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "process", "io-util", "time", "signal"] }
tokio-util = "0.7.19"
ulid = "3.0.0"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 3
